services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  engineering-rag:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../.local:/app/.local
      - ../artifacts:/app/artifacts
    depends_on:
      - elasticsearch

volumes:
  es-data:

