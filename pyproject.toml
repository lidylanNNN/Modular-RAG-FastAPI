[project]
name = "engineering-rag"
version = "0.1.0"
description = "Evaluation-driven, evidence-bound engineering document RAG service."
requires-python = ">=3.11,<3.13"
dependencies = [
    "elasticsearch>=8.15,<9",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=4.3,<6",
    "python-pptx>=1.0,<2",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
