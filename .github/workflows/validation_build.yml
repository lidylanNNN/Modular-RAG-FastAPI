name: Validation dataset build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - name: Install project and development dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Validate source files and gold anchors
        run: python -X utf8 scripts/validation_build/validate_suite.py
      - name: Validate historical fixtures
        run: python -X utf8 scripts/validation_build/validate_dataset.py validation_build/datasets/archive/synthetic-v1
      - name: Run validator regression tests
        run: uv run --locked pytest tests
      - name: Validate from outside the repository
        working-directory: ${{ runner.temp }}
        run: python -X utf8 "${{ github.workspace }}/scripts/validation_build/validate_suite.py"
