name: Evaluation fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source files and gold anchors
        run: python -X utf8 scripts/evaluation/validate_suite.py
      - name: Validate historical fixtures
        run: python -X utf8 scripts/evaluation/validate_dataset.py evaluation/datasets/archive/synthetic-v1
      - name: Run validator regression tests
        run: python -X utf8 -m unittest discover -s tests -t . -p "test_*.py"
      - name: Validate from outside the repository
        working-directory: ${{ runner.temp }}
        run: python -X utf8 "${{ github.workspace }}/scripts/evaluation/validate_suite.py"
